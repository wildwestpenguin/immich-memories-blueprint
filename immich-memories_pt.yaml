blueprint:
  name: Memórias Immich v3.0
  description: >-
    Envia uma notificação diária com uma memória aleatória do Immich. Dispara a
    partir da hora definida e aguarda um tempo aleatório para parecer mais
    natural. Permite selecionar múltiplos telemóveis e escolher o idioma dos
    textos (PT/EN/ES/DE/ZH/FR/NL/PL/IT/JA) com um clique.


    ⚠️ Requer que tenhas definido um `rest_command.immich_get_memories` no teu
    `configuration.yaml`, por exemplo:

    ```yaml

    rest_command:
      immich_get_memories:
        url: "{{ api_url }}/api/memories"
        method: GET
        headers:
          x-api-key: "{{ api_key }}"
          Accept: "application/json"
    ```


    🔒 **Segurança da API Key**: a chave de API do Immich usada neste blueprint
    só precisa das seguintes permissões (scopes): `memory.read`, `asset.read`
    e `asset.view`. Cria uma API key dedicada com **apenas** estas três
    permissões — não uses uma chave com acesso total (admin ou "all"), para
    minimizar o impacto caso a chave seja exposta.
  domain: automation
  input:
    immich_api_url:
      name: Immich API URL
      description: "URL base do servidor Immich (ex: https://immich.exemplo.com)"
      default: ''
    immich_api_key:
      name: Immich API Key
      description: >-
        Chave de API do Immich. Cria-a com apenas as permissões memory.read,
        asset.read e asset.view (nenhuma outra é necessária).
      default: ''
    immich_ui_url:
      name: Immich UI URL / Mode
      default: Android App
      selector:
        select:
          options:
          - Android App
          - iOS App
          custom_value: true
          multiple: false
    notify_targets:
      name: Telemóveis a Notificar
      description: Seleciona os telemóveis que vão receber a notificação.
      selector:
        device:
          filter:
          - integration: mobile_app
          multiple: true
    time_of_day:
      name: Hora de Início
      description: A partir de que hora a automação começa a processar.
      default: "09:00:00"
      selector:
        time: {}
    max_delay_minutes:
      name: Atraso Máximo (Minutos)
      description: O alerta vai chegar de forma natural entre a hora de início e este limite em minutos.
      default: 180
      selector:
        number:
          min: 1
          max: 480
          unit_of_measurement: min
          mode: slider
    include_image:
      name: Incluir Miniatura
      default: true
      selector:
        boolean: {}
    memory_selection_mode:
      name: Seleção de Memória
      default: random
      selector:
        select:
          options:
          - random
          - newest
          - oldest
    asset_selection_mode:
      name: Seleção de Imagem da Memória
      default: random
      selector:
        select:
          options:
          - random
          - newest
          - oldest
    language:
      name: Idioma dos Textos
      description: "Escolhe o idioma dos textos padrão (título, mensagem, 'ano'/'anos'). Se preencheres os campos de texto abaixo manualmente, eles têm sempre prioridade sobre esta escolha."
      default: pt
      selector:
        select:
          options:
          - label: Português
            value: pt
          - label: English
            value: en
          - label: Español
            value: es
          - label: Deutsch
            value: de
          - label: 中文（简体）
            value: zh
          - label: Français
            value: fr
          - label: Nederlands
            value: nl
          - label: Polski
            value: pl
          - label: Italiano
            value: it
          - label: 日本語
            value: ja
          mode: dropdown
    message_template:
      name: Modelo da Mensagem (opcional)
      description: "Deixa vazio para usar o texto padrão do idioma escolhido acima. Placeholders disponíveis: {years_ago}, {years_ago_label}"
      default: ''
      selector:
        text:
          multiline: false
    title_template:
      name: Modelo do Título (opcional)
      description: "Deixa vazio para usar o texto padrão do idioma escolhido acima."
      default: ''
      selector:
        text:
          multiline: false
    label_year_singular:
      name: Texto para 1 Ano (opcional)
      description: "Deixa vazio para usar o texto padrão do idioma escolhido acima."
      default: ''
      selector:
        text:
          multiline: false
    label_year_plural:
      name: Texto para vários Anos (opcional)
      description: "Deixa vazio para usar o texto padrão do idioma escolhido acima."
      default: ''
      selector:
        text:
          multiline: false
    notification_icon:
      name: Ícone da Notificação
      default: ''
      selector:
        icon: {}
    notification_channel:
      name: Canal de Notificação
      default: ''
      selector:
        text:
          multiline: false
    notify_on_no_memories:
      name: Notificar Quando Não Há Memórias
      description: "Se ativo, envia uma notificação a avisar quando não são encontradas memórias do Immich para o dia. Se desativado, nesses dias a automação simplesmente não faz nada."
      default: true
      selector:
        boolean: {}
trigger:
- platform: time
  at: !input time_of_day
action:
- variables:
    max_minutes: !input max_delay_minutes
- delay: "{{ range(1, max_minutes | int + 1) | random | int * 60 }}"
- variables:
    api_url: !input immich_api_url
    api_key: !input immich_api_key
    ui_url: !input immich_ui_url
    targets: !input notify_targets
    include_image: !input include_image
    memory_selection_mode: !input memory_selection_mode
    asset_selection_mode: !input asset_selection_mode
    notification_icon: !input notification_icon
    notification_channel: !input notification_channel
    notify_on_no_memories: !input notify_on_no_memories
    language: !input language
    user_message_template: !input message_template
    user_title_template: !input title_template
    user_label_year_singular: !input label_year_singular
    user_label_year_plural: !input label_year_plural

    lang_strings: >-
      {{ {
        'pt': {
          'title': 'Memórias de hoje',
          'message': 'No dia de hoje, há {years_ago} {years_ago_label}',
          'year_singular': 'ano',
          'year_plural': 'anos',
          'fallback_title': 'Memórias',
          'no_memories_title': 'Sem memórias hoje',
          'no_memories_message': 'Não foram encontradas memórias do Immich para hoje.'
        },
        'en': {
          'title': "Today's Memories",
          'message': 'On this day, {years_ago} {years_ago_label} ago',
          'year_singular': 'year',
          'year_plural': 'years',
          'fallback_title': 'Memories',
          'no_memories_title': 'No memories today',
          'no_memories_message': 'No Immich memories were found for today.'
        },
        'es': {
          'title': 'Recuerdos de hoy',
          'message': 'En este día, hace {years_ago} {years_ago_label}',
          'year_singular': 'año',
          'year_plural': 'años',
          'fallback_title': 'Recuerdos',
          'no_memories_title': 'Sin recuerdos hoy',
          'no_memories_message': 'No se encontraron recuerdos de Immich para hoy.'
        },
        'de': {
          'title': 'Erinnerungen von heute',
          'message': 'An diesem Tag, vor {years_ago} {years_ago_label}',
          'year_singular': 'Jahr',
          'year_plural': 'Jahren',
          'fallback_title': 'Erinnerungen',
          'no_memories_title': 'Keine Erinnerungen heute',
          'no_memories_message': 'Für heute wurden keine Immich-Erinnerungen gefunden.'
        },
        'zh': {
          'title': '今日回忆',
          'message': '在这一天，已经过去了{years_ago}{years_ago_label}',
          'year_singular': '年',
          'year_plural': '年',
          'fallback_title': '回忆',
          'no_memories_title': '今天没有回忆',
          'no_memories_message': '未找到今天的 Immich 回忆。'
        },
        'fr': {
          'title': 'Souvenirs du jour',
          'message': 'Ce jour-là, il y a {years_ago} {years_ago_label}',
          'year_singular': 'an',
          'year_plural': 'ans',
          'fallback_title': 'Souvenirs',
          'no_memories_title': 'Aucun souvenir aujourd''hui',
          'no_memories_message': 'Aucun souvenir Immich n''a été trouvé pour aujourd''hui.'
        },
        'nl': {
          'title': 'Herinneringen van vandaag',
          'message': 'Op deze dag, {years_ago} {years_ago_label} geleden',
          'year_singular': 'jaar',
          'year_plural': 'jaar',
          'fallback_title': 'Herinneringen',
          'no_memories_title': 'Geen herinneringen vandaag',
          'no_memories_message': 'Er zijn geen Immich-herinneringen gevonden voor vandaag.'
        },
        'pl': {
          'title': 'Dzisiejsze wspomnienia',
          'message': 'W tym dniu, {years_ago} {years_ago_label} temu',
          'year_singular': 'rok',
          'year_plural': 'lat',
          'fallback_title': 'Wspomnienia',
          'no_memories_title': 'Brak wspomnień dzisiaj',
          'no_memories_message': 'Nie znaleziono wspomnień Immich na dzisiaj.'
        },
        'it': {
          'title': 'Ricordi di oggi',
          'message': 'In questo giorno, {years_ago} {years_ago_label} fa',
          'year_singular': 'anno',
          'year_plural': 'anni',
          'fallback_title': 'Ricordi',
          'no_memories_title': 'Nessun ricordo oggi',
          'no_memories_message': 'Nessun ricordo Immich trovato per oggi.'
        },
        'ja': {
          'title': '今日の思い出',
          'message': 'この日から{years_ago}{years_ago_label}前の出来事です',
          'year_singular': '年',
          'year_plural': '年',
          'fallback_title': '思い出',
          'no_memories_title': '今日の思い出はありません',
          'no_memories_message': '今日のImmichの思い出は見つかりませんでした。'
        }
      }[language] if language in ['pt','en','es','de','zh','fr','nl','pl','it','ja'] else {
          'title': "Today's Memories",
          'message': 'On this day, {years_ago} {years_ago_label} ago',
          'year_singular': 'year',
          'year_plural': 'years',
          'fallback_title': 'Memories',
          'no_memories_title': 'No memories today',
          'no_memories_message': 'No Immich memories were found for today.'
      } }}

    effective_message_template: "{{ user_message_template if user_message_template | length > 0 else lang_strings.message }}"
    effective_title_template: "{{ user_title_template if user_title_template | length > 0 else lang_strings.title }}"
    effective_label_year_singular: "{{ user_label_year_singular if user_label_year_singular | length > 0 else lang_strings.year_singular }}"
    effective_label_year_plural: "{{ user_label_year_plural if user_label_year_plural | length > 0 else lang_strings.year_plural }}"
- action: rest_command.immich_get_memories
  data:
    api_url: '{{ api_url }}'
    api_key: '{{ api_key }}'
  response_variable: memories_response
- variables:
    memory_list: >-
      {{ memories_response.content | from_json if memories_response.content is defined and memories_response.content is string
         else memories_response.content if memories_response.content is defined
         else [] }}

    selected_memory: >-
      {{ memory_list | random if memory_selection_mode == 'random' and memory_list is iterable and memory_list | length > 0
         else (memory_list | sort(attribute='data.year', reverse=true) | first) if memory_selection_mode == 'newest' and memory_list is iterable and memory_list | length > 0
         else (memory_list | sort(attribute='data.year') | first) if memory_list is iterable and memory_list | length > 0
         else 'none' }}

    selected_assets: '{{ selected_memory.assets if (selected_memory and selected_memory != "none" and selected_memory.assets is defined) else [] }}'

    selected_asset: >-
      {{ selected_assets | random if asset_selection_mode == 'random' and selected_assets is iterable and selected_assets | length > 0
         else (selected_assets | sort(attribute='fileCreatedAt', reverse=true) | first) if asset_selection_mode == 'newest' and selected_assets is iterable and selected_assets | length > 0
         else (selected_assets | sort(attribute='fileCreatedAt') | first) if selected_assets is iterable and selected_assets | length > 0
         else 'none' }}

    deep_link: >-
      {{ 'deep-link://immich://memory?id=' ~ selected_memory.id if ui_url == 'Android App' and selected_memory and selected_memory != 'none' and selected_memory.id is defined
         else 'immich://memory?id=' ~ selected_memory.id if ui_url == 'iOS App' and selected_memory and selected_memory != 'none' and selected_memory.id is defined
         else ui_url ~ '/memory?id=' ~ selected_memory.id if ui_url | length > 0 and selected_memory and selected_memory != 'none' and selected_memory.id is defined
         else api_url ~ '/memory?id=' ~ selected_memory.id if selected_memory and selected_memory != 'none' and selected_memory.id is defined
         else '' }}

    years_ago: '{{ now().year - selected_memory.data.year if (selected_memory and selected_memory != "none" and selected_memory.data is defined) else 0 }}'

    years_ago_label: '{{ effective_label_year_singular if years_ago | int == 1 else effective_label_year_plural }}'

    parsed_message: >-
      {{ effective_message_template | replace('{years_ago}', years_ago | string)
                                    | replace('{years_ago_label}', years_ago_label) }}
    parsed_title: >-
      {{ (effective_title_template if effective_title_template | length > 0 else lang_strings.fallback_title)
         | replace('{years_ago}', years_ago | string)
         | replace('{years_ago_label}', years_ago_label) }}
    notification_data: >-
      {% set clean_api_url = api_url.rstrip('/') %}
      {% set thumb_url = clean_api_url ~ "/api/assets/" ~ selected_asset.id ~ "/thumbnail?apiKey=" ~ api_key ~ "&format=JPEG&size=preview" %}
      {% set base_data = {
        "clickAction": deep_link,
        "url": deep_link
      } %}
      {% if include_image and selected_asset != "none" and selected_asset.id is defined %}
        {% set base_data = dict(base_data, **{
          "image": thumb_url,
          "attachment": {"url": thumb_url}
        }) %}
      {% endif %}
      {% if notification_icon | length > 0 %}
        {% set base_data = dict(base_data, **{"notification_icon": notification_icon}) %}
      {% endif %}
      {% if notification_channel | length > 0 %}
        {% set base_data = dict(base_data, **{"channel": notification_channel}) %}
      {% endif %}
      {{ base_data }}
- choose:
  - conditions:
    - condition: template
      value_template: '{{ selected_memory != "none" and selected_memory != none }}'
    sequence:
    - repeat:
        for_each: '{{ targets }}'
        sequence:
        - variables:
            device_name: "{{ device_attr(repeat.item, 'name') | slugify }}"
        - action: "notify.mobile_app_{{ device_name }}"
          data:
            title: "{{ parsed_title }}"
            message: "{{ parsed_message }}"
            data: "{{ notification_data }}"
  - conditions:
    - condition: template
      value_template: '{{ (selected_memory == "none" or selected_memory == none) and notify_on_no_memories }}'
    sequence:
    - repeat:
        for_each: '{{ targets }}'
        sequence:
        - variables:
            device_name: "{{ device_attr(repeat.item, 'name') | slugify }}"
            notify_entity: "{{ device_entities(repeat.item) | select('match', '^notify\\.') | list | first | default('', true) }}"
        - if:
          - condition: template
            value_template: "{{ notify_entity | length > 0 }}"
          then:
          - action: notify.send_message
            target:
              entity_id: "{{ notify_entity }}"
            data:
              title: "{{ lang_strings.no_memories_title }}"
              message: "{{ lang_strings.no_memories_message }}"
          else:
          - action: "notify.mobile_app_{{ device_name }}"
            data:
              title: "{{ lang_strings.no_memories_title }}"
              message: "{{ lang_strings.no_memories_message }}"
mode: single
